<div class="container">
    <h2>🇦🇪 Gratuity Calculator UAE</h2>

    <label>Basic Salary (AED)</label>
    <input type="number" id="salary" placeholder="e.g. 5000" min="0">

    <label>Reason for Leaving</label>
    <select id="reason">
        <option value="">Select Reason</option>
        <option value="resign">Resignation</option>

    <select id="contract">
        <option value="">Select Contract</option>

        <option value="unlimited">Unlimited</option>
    </select>

    <label>Start Date</label>
    <input type="date" id="start">

    <label>End Date</label>
    <input type="date" id="end">

    <button onclick="calculate()">Calculate Gratuity</button>

<script>
function calculate() {
    let salary = parseFloat(document.getElementById("salary").value);
    let start = new Date(document.getElementById("start").value);
    let end = new Date(document.getElementById("end").value);
    let reason = document.getElementById("reason").value;
    let contract = document.getElementById("contract").value;

    if (!salary || !document.getElementById("start").value || !document.getElementById("end").value || !reason || !contract) {
        alert("Please fill all fields");
        return;
    }

    if (end <= start) {
        alert("End date must be after start date");
        return;
    }

    let years = (end - start) / (1000 * 60 * 60 * 24 * 365.25);

    if (years < 1) {
        document.getElementById("result").innerHTML = "❌ Less than 1 year — No gratuity";
        document.getElementById("breakdown").style.display = "none";
        return;
    }

    let dailySalary = salary / 30;
    let part1 = 0, part2 = 0;
    let part1Years = Math.min(years, 5);
    let part2Years = Math.max(years - 5, 0);

    part1 = dailySalary * 21 * part1Years;
    part2 = dailySalary * 30 * part2Years;

    let gratuity = part1 + part2;
    let maxGratuity = salary * 24;
    if (gratuity > maxGratuity) gratuity = maxGratuity;

    let totalYears = Math.floor(years);
    let totalMonths = Math.floor((years % 1) * 12);

    document.getElementById("result").innerHTML = "✅ Gratuity: AED " + gratuity.toLocaleString('en-AE', {minimumFractionDigits: 2, maximumFractionDigits: 2});

    let bd = document.getElementById("breakdown");
    bd.style.display = "block";
    bd.innerHTML = `
        <div><span>Service Period</span><span>${totalYears}y ${totalMonths}m</span></div>
        <div><span>Daily Salary</span><span>AED ${dailySalary.toFixed(2)}</span></div>
        <div><span>First 5 Years (21 days)</span><span>AED ${part1.toFixed(2)}</span></div>
        ${part2Years > 0 ? `<div><span>After 5 Years (30 days)</span><span>AED ${part2.toFixed(2)}</span></div>` : ''}
        <div><span><b>Total Gratuity</b></span><span><b>AED ${gratuity.toLocaleString('en-AE', {minimumFractionDigits:2})}</b></span></div>
    `;
}

// Set today as default end date
document.getElementById("end").value = new Date().toISOString().split('T')[0];
</script>
